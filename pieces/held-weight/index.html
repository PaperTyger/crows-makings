<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Held Weight — Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Georgia, serif; background: #0e1016; color: #e8e2d4; min-height: 100vh; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
        .sidebar { width: 280px; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 22px; }
        h1 { font-size: 1.1rem; margin-bottom: 6px; }
        .subtitle { font-style: italic; color: #b0a894; font-size: 0.85rem; line-height: 1.45; margin-bottom: 18px; }
        label { display: block; font-size: 0.8rem; color: #b0a894; margin: 16px 0 6px; }
        input[type=range] { width: 100%; }
        #readout { margin-top: 18px; font-size: 0.85rem; color: #cfc6b2; line-height: 1.5; }
        #canvas-holder canvas { max-width: 100%; height: auto; border-radius: 4px; }
    </style>
</head>
<body>
<a href="../../index.html" style="position:fixed;top:16px;left:16px;z-index:100;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);color:#141413;text-decoration:none;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(20,20,19,0.12);border:1px solid #e8e6dc;">&larr; Crow's Makings</a>
<div class="container">
    <div class="sidebar">
        <h1>Held Weight</h1>
        <p class="subtitle">A band of rubber is a tangle of chains, and the only thing holding the weight up is how much they shake. Warm them and they pull harder, unless the weight is light enough that the band just grows.</p>
        <label for="heat">warmth</label>
        <input type="range" id="heat" min="263" max="373" value="293">
        <label for="load">what hangs from it</label>
        <input type="range" id="load" min="1" max="100" value="45">
        <div id="readout"></div>
    </div>
    <div id="canvas-holder"></div>
</div>
<script src="band-logic.js"></script>
<script src="sketch.js"></script>
</body>
</html>
