<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Map</title>
<style>
  :root { --bg: #e4e2dc; --ink: #24231f; --muted: #66635b; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, serif;
         display: flex; flex-direction: column; align-items: center; padding: 16px; }
  #holder canvas { max-width: 100%; height: auto; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
  .controls { display: flex; gap: 18px; align-items: center; margin-top: 12px; flex-wrap: wrap;
              font-size: 14px; color: var(--muted); }
  button { font: inherit; background: none; border: 1px solid var(--muted); color: var(--ink);
           padding: 3px 10px; cursor: pointer; }
</style>
</head>
<body>
<a href="../../index.html" style="position:fixed;top:16px;left:16px;z-index:100;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);color:#141413;text-decoration:none;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(20,20,19,0.12);border:1px solid #e8e6dc;">&larr; Crow's Makings</a>
<div id="holder"></div>
<div class="controls">
  <label>years <input id="years" type="range" min="0" max="400" value="140"></label>
  <button id="recast">new stone</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="sketch.js"></script>
</body>
</html>
