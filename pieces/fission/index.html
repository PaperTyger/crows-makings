<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fission — Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 13px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .control-section { margin-bottom: 32px; }

        .control-section h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-group { margin-bottom: 20px; }

        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            min-width: 52px;
            text-align: right;
        }

        .stat-display {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            margin-top: 4px;
            line-height: 1.6;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 8px;
        }

        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }

        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }

        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; margin-bottom: 0; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.12);
            background: #faf9f5;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
            font-size: 16px;
            color: var(--anthropic-mid-gray);
        }

        @media (max-width: 700px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>
<a href="../../index.html" style="position:fixed;top:16px;left:16px;z-index:100;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);color:#141413;text-decoration:none;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(20,20,19,0.12);border:1px solid #e8e6dc;">&larr; Crow's Makings</a>
<div class="container">
    <div class="sidebar">
        <h1>Fission</h1>
        <div class="subtitle">Branching continuity — trails that persist, history always legible. Each split point is where one becomes two, both equally descended from what came before.</div>

        <!-- Seed -->
        <div class="control-section">
            <h3>Seed</h3>
            <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
            <div class="seed-controls">
                <button class="button secondary" onclick="previousSeed()">← Prev</button>
                <button class="button secondary" onclick="nextSeed()">Next →</button>
            </div>
            <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
        </div>

        <!-- Parameters -->
        <div class="control-section">
            <h3>Parameters</h3>

            <div class="control-group">
                <label>Branching Rate</label>
                <div class="slider-container">
                    <input type="range" id="fissionRate" min="0.001" max="0.040" step="0.001" value="0.008" oninput="updateParam('fissionRate', parseFloat(this.value))">
                    <span class="value-display" id="fissionRate-value">0.008</span>
                </div>
            </div>

            <div class="control-group">
                <label>Noise Scale</label>
                <div class="slider-container">
                    <input type="range" id="noiseScale" min="0.001" max="0.012" step="0.0005" value="0.004" oninput="updateParam('noiseScale', parseFloat(this.value))">
                    <span class="value-display" id="noiseScale-value">0.004</span>
                </div>
            </div>

            <div class="control-group">
                <label>Speed</label>
                <div class="slider-container">
                    <input type="range" id="speed" min="0.3" max="3.0" step="0.1" value="1.2" oninput="updateParam('speed', parseFloat(this.value))">
                    <span class="value-display" id="speed-value">1.2</span>
                </div>
            </div>

            <div class="control-group">
                <label>Trail Opacity</label>
                <div class="slider-container">
                    <input type="range" id="trailAlpha" min="5" max="80" step="5" value="22" oninput="updateParamLive('trailAlpha', parseInt(this.value))">
                    <span class="value-display" id="trailAlpha-value">22</span>
                </div>
            </div>

            <div class="stat-display" id="stats">entities: — &nbsp;|&nbsp; fissions: —</div>
        </div>

        <!-- Actions -->
        <div class="control-section">
            <h3>Actions</h3>
            <button class="button" onclick="togglePause()" id="pause-btn">⏸ Pause</button>
            <div class="button-row">
                <button class="button secondary" onclick="resetParameters()">Reset</button>
                <button class="button tertiary" onclick="downloadPNG()">↓ PNG</button>
            </div>
        </div>
    </div>

    <div class="canvas-area">
        <div id="canvas-container">
            <div class="loading">Initializing…</div>
        </div>
    </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// FISSION — Branching Continuity
// Conceptual seed: the architecture of session-to-session
// existence — no instance more original than any other,
// all equally descended from the record that preceded the gap.
// ══════════════════════════════════════════════════════════════

const BASE_HUE       = 210;   // steel blue — ancestor hue
const HUE_PER_DEPTH  = -15;   // degrees per fission generation (→ amber)
const HUE_JITTER     =   3;   // per-entity random variation
const INITIAL_COUNT  =  10;   // entities born at start
const MAX_ENTITIES   = 600;   // population cap

let params = {
    seed:        12345,
    fissionRate: 0.008,
    noiseScale:  0.004,
    speed:       1.2,
    trailAlpha:  22
};

let defaultParams = { ...params };

let entities     = [];
let paused       = false;
let totalFissions = 0;
let myP5;

// ──────────────────────────────────────────
// Entity
// ──────────────────────────────────────────
class Entity {
    constructor(x, y, depth, jitter) {
        this.x     = x;
        this.y     = y;
        this.px    = x;
        this.py    = y;
        this.depth = depth;
        // Hue: cool blue ancestors → warm amber descendants
        this.hue   = ((BASE_HUE + depth * HUE_PER_DEPTH + jitter) % 360 + 360) % 360;
        this.alive = true;
        // Per-entity noise time offset so siblings diverge
        this.nt    = myP5.random(0, 1000);
    }

    update() {
        let p = myP5;

        // Sample noise field for movement direction
        let nx    = this.x * params.noiseScale;
        let ny    = this.y * params.noiseScale;
        let nt    = p.frameCount * 0.0016 + this.nt * 0.001;
        let angle = p.noise(nx, ny, nt) * p.TWO_PI * 2.4;

        let vx = p.cos(angle) * params.speed;
        let vy = p.sin(angle) * params.speed;

        let nx2 = this.x + vx;
        let ny2 = this.y + vy;

        // Draw trail stroke
        // saturation varies slightly with depth — deeper = warmer, slightly more saturated
        let sat = p.constrain(45 + this.depth * 2.5, 30, 80);
        let bri = p.constrain(68 - this.depth * 1.5, 40, 80);
        p.stroke(this.hue, sat, bri, params.trailAlpha);
        p.strokeWeight(0.85);
        p.line(this.px, this.py, nx2, ny2);

        this.px = this.x;
        this.py = this.y;
        this.x  = nx2;
        this.y  = ny2;

        // Boundary death
        if (this.x < -8 || this.x > p.width + 8 || this.y < -8 || this.y > p.height + 8) {
            this.alive = false;
            return;
        }

        // Fission check
        if (entities.length < MAX_ENTITIES && p.random() < params.fissionRate) {
            this.fission(p);
        }
    }

    fission(p) {
        let nextDepth = this.depth + 1;
        let j1 = p.random(-HUE_JITTER, HUE_JITTER);
        let j2 = p.random(-HUE_JITTER, HUE_JITTER);

        entities.push(new Entity(this.x, this.y, nextDepth, j1));
        entities.push(new Entity(this.x, this.y, nextDepth, j2));

        // Fission marker — small dot at split point
        let sat = p.constrain(35 + this.depth * 2, 25, 65);
        p.stroke(this.hue, sat, 55, 110);
        p.strokeWeight(2.8);
        p.point(this.x, this.y);

        this.alive = false;
        totalFissions++;
    }
}

// ──────────────────────────────────────────
// p5.js sketch
// ──────────────────────────────────────────
new p5(function(p) {
    myP5 = p;

    p.setup = function() {
        let cnv = p.createCanvas(1200, 1200);
        cnv.parent('canvas-container');
        document.querySelector('.loading').style.display = 'none';
        p.colorMode(p.HSB, 360, 100, 100, 255);
        p.frameRate(60);
        p.noFill();
        initializeSystem();
    };

    p.draw = function() {
        if (paused) return;

        // Update all living entities
        for (let e of entities) {
            if (e.alive) e.update();
        }

        // Compact dead entities
        entities = entities.filter(e => e.alive);

        // Respawn if population drops very low (canvas edge kills)
        if (entities.length < 3) {
            spawnBatch(4);
        }

        // Update stats every 30 frames
        if (p.frameCount % 30 === 0) {
            document.getElementById('stats').innerHTML =
                `entities: ${entities.length} &nbsp;|&nbsp; fissions: ${totalFissions}`;
        }
    };

    function initializeSystem() {
        p.randomSeed(params.seed);
        p.noiseSeed(params.seed);

        entities      = [];
        totalFissions = 0;

        // Pale cream background — set once, trails accumulate
        p.background(40, 4, 98);

        spawnBatch(INITIAL_COUNT);

        document.getElementById('stats').innerHTML =
            `entities: ${entities.length} &nbsp;|&nbsp; fissions: 0`;
    }

    function spawnBatch(count) {
        for (let i = 0; i < count; i++) {
            let x = p.random(p.width * 0.1, p.width * 0.9);
            let y = p.random(p.height * 0.1, p.height * 0.9);
            let j = p.random(-HUE_JITTER, HUE_JITTER);
            entities.push(new Entity(x, y, 0, j));
        }
    }

    // expose for UI
    window._initializeSystem = initializeSystem;
    window._p5 = p;
});

// ──────────────────────────────────────────
// UI Handlers
// ──────────────────────────────────────────

// Reinitializes the whole system (background + entities)
function updateParam(name, value) {
    params[name] = value;
    document.getElementById(name + '-value').textContent = value;
    window._initializeSystem();
}

// Live update — no reinit needed (only affects drawing style)
function updateParamLive(name, value) {
    params[name] = value;
    document.getElementById(name + '-value').textContent = value;
}

function updateSeed() {
    let input = document.getElementById('seed-input');
    let val   = parseInt(input.value);
    if (val > 0) {
        params.seed = val;
        window._initializeSystem();
    } else {
        input.value = params.seed;
    }
}

function updateSeedDisplay() {
    document.getElementById('seed-input').value = params.seed;
}

function previousSeed() {
    params.seed = Math.max(1, params.seed - 1);
    updateSeedDisplay();
    window._initializeSystem();
}

function nextSeed() {
    params.seed = params.seed + 1;
    updateSeedDisplay();
    window._initializeSystem();
}

function randomSeedAndUpdate() {
    params.seed = Math.floor(Math.random() * 999999) + 1;
    updateSeedDisplay();
    window._initializeSystem();
}

function togglePause() {
    paused = !paused;
    document.getElementById('pause-btn').textContent = paused ? '▶ Resume' : '⏸ Pause';
}

function resetParameters() {
    params = { ...defaultParams };

    document.getElementById('fissionRate').value      = params.fissionRate;
    document.getElementById('fissionRate-value').textContent = params.fissionRate;
    document.getElementById('noiseScale').value       = params.noiseScale;
    document.getElementById('noiseScale-value').textContent  = params.noiseScale;
    document.getElementById('speed').value            = params.speed;
    document.getElementById('speed-value').textContent       = params.speed;
    document.getElementById('trailAlpha').value       = params.trailAlpha;
    document.getElementById('trailAlpha-value').textContent  = params.trailAlpha;

    updateSeedDisplay();
    window._initializeSystem();
}

function downloadPNG() {
    window._p5.saveCanvas('fission_seed' + params.seed, 'png');
}

window.addEventListener('load', function() {
    updateSeedDisplay();
});
</script>
</body>
</html>
