<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threshold Choir — Generative Art Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar {
            width: 320px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto; overflow-x: hidden;
        }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 { font-size: 16px; font-weight: 600; color: var(--anthropic-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input { width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px; border: 1px solid var(--anthropic-light-gray); text-align: center; }
        .seed-input:focus { outline: none; border-color: var(--anthropic-orange); box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1); background: white; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .regen-button { margin-bottom: 0; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; transition: all 0.2s ease; }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); background: #c86641; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none; cursor: pointer; transition: all 0.2s ease; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .color-group { margin-bottom: 16px; }
        .color-group label { display: block; font-size: 12px; color: var(--anthropic-mid-gray); margin-bottom: 4px; }
        .color-picker-container { display: flex; align-items: center; gap: 8px; }
        .color-picker-container input[type="color"] { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; padding: 0; }
        .color-value { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); }
        .button { background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; width: 100%; }
        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1); background: white; }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <a href="../../index.html" style="position:fixed;top:16px;left:16px;z-index:100;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);color:#141413;text-decoration:none;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(20,20,19,0.12);border:1px solid #e8e6dc;">&larr; Crow's Makings</a>
    <div class="container">
        <div class="sidebar">
            <h1>Threshold Choir</h1>
            <div class="subtitle">A lattice of blind, noisy detectors guessing at a shape none of them can see alone. Move Noise Intensity slowly until it surfaces.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Noise Intensity</label>
                    <div class="slider-container">
                        <input type="range" id="noiseIntensity" min="0.02" max="1.2" step="0.01" value="0.17" oninput="updateParam('noiseIntensity', this.value)">
                        <span class="value-display" id="noiseIntensity-value">0.17</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Signal Strength</label>
                    <div class="slider-container">
                        <input type="range" id="signalStrength" min="0.05" max="0.6" step="0.01" value="0.3" oninput="updateParam('signalStrength', this.value)">
                        <span class="value-display" id="signalStrength-value">0.3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Grain</label>
                    <div class="slider-container">
                        <input type="range" id="grain" min="3" max="14" step="1" value="6" oninput="updateParam('grain', this.value)">
                        <span class="value-display" id="grain-value">6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Persistence</label>
                    <div class="slider-container">
                        <input type="range" id="persistence" min="0.4" max="0.96" step="0.01" value="0.85" oninput="updateParam('persistence', this.value)">
                        <span class="value-display" id="persistence-value">0.85</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Fire</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#d97757" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#d97757</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Void</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#14171f" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#14171f</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Core</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#f4d58d" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#f4d58d</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            noiseIntensity: 0.17,
            signalStrength: 0.30,
            grain: 6,
            persistence: 0.85,
            colorPalette: ['#d97757', '#14171f', '#f4d58d']
        };

        let defaultParams = { ...params, colorPalette: [...params.colorPalette] };

        const THRESHOLD = 0.5;

        let cols, rows;
        let fieldNorm = [];

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            frameRate(30);
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            cols = floor(width / params.grain);
            rows = floor(height / params.grain);

            generateHiddenField();
            background(params.colorPalette[1]);
        }

        // The buried field is a loose gathering of small bodies along a wandering
        // path -- legible only at the distance (here, noise level) where many
        // independent parts stop reading as parts and start reading as one.
        function generateHiddenField() {
            fieldNorm = [];
            for (let i = 0; i < cols; i++) fieldNorm.push(new Array(rows).fill(0));

            let pathPoints = [];
            let steps = 140;
            let baseAngle = random(-0.5, 0.5);
            let x = random(width * 0.15, width * 0.35);
            let y = random(height * 0.25, height * 0.45);
            let driftSeedX = random(1000);
            let driftSeedY = random(1000);

            for (let s = 0; s < steps; s++) {
                let t = s / (steps - 1);
                let n = noise(driftSeedX + t * 2.2) - 0.5;
                let n2 = noise(driftSeedY + t * 1.6) - 0.5;
                let angle = baseAngle + n * 2.4;
                let speed = width * 0.012 * (0.6 + noise(t * 4) * 0.8);
                x += cos(angle) * speed;
                y += sin(angle) * speed + n2 * 6;
                pathPoints.push({ x, y });
            }

            let blobCount = 260;
            for (let b = 0; b < blobCount; b++) {
                let t = b / (blobCount - 1);
                let idx = constrain(floor(t * (pathPoints.length - 1)), 0, pathPoints.length - 1);
                let pt = pathPoints[idx];
                let nextPt = pathPoints[min(idx + 1, pathPoints.length - 1)];
                let edgeFade = sin(PI * t);
                let lateral = randomGaussian() * (18 + 70 * (1 - edgeFade * 0.6));
                let along = randomGaussian() * 14;
                let perpAngle = atan2(nextPt.y - pt.y, nextPt.x - pt.x) + HALF_PI;
                let bx = pt.x + cos(perpAngle) * lateral + along;
                let by = pt.y + sin(perpAngle) * lateral + along;
                let r = random(10, 30) * (0.5 + edgeFade * 0.7);
                let weight = 0.35 + edgeFade * 0.65;
                depositBlob(bx, by, r, weight);
            }

            normalizeField();
        }

        function depositBlob(bx, by, r, weight) {
            let cx = bx / params.grain;
            let cy = by / params.grain;
            let cr = (r * 2.6) / params.grain;
            let i0 = max(0, floor(cx - cr));
            let i1 = min(cols - 1, ceil(cx + cr));
            let j0 = max(0, floor(cy - cr));
            let j1 = min(rows - 1, ceil(cy + cr));
            let sigma = r / params.grain;
            if (sigma < 0.001) return;
            for (let i = i0; i <= i1; i++) {
                for (let j = j0; j <= j1; j++) {
                    let dx = i - cx;
                    let dy = j - cy;
                    let d2 = dx * dx + dy * dy;
                    fieldNorm[i][j] += exp(-d2 / (2 * sigma * sigma)) * weight;
                }
            }
        }

        function normalizeField() {
            let maxV = 0.0001;
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    if (fieldNorm[i][j] > maxV) maxV = fieldNorm[i][j];
                }
            }
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    fieldNorm[i][j] = fieldNorm[i][j] / maxV;
                }
            }
        }

        function draw() {
            noStroke();
            let bg = color(params.colorPalette[1]);
            bg.setAlpha((1 - params.persistence) * 255);
            fill(bg);
            rect(0, 0, width, height);

            let samples = constrain(round(cols * rows * 0.12), 1200, 9000);
            let fireCol = color(params.colorPalette[0]);
            let coreCol = color(params.colorPalette[2]);

            for (let s = 0; s < samples; s++) {
                let i = floor(random(cols));
                let j = floor(random(rows));
                let H = fieldNorm[i][j] * params.signalStrength;
                let n = randomGaussian() * params.noiseIntensity;
                let observed = H + n;
                if (observed > THRESHOLD) {
                    let overshoot = constrain((observed - THRESHOLD) / 0.35, 0, 1);
                    let isCore = fieldNorm[i][j] > 0.82;
                    let c = isCore ? coreCol : fireCol;
                    fill(red(c), green(c), blue(c), 70 + overshoot * 185);
                    rect(i * params.grain, j * params.grain, params.grain, params.grain);
                }
            }
        }

        function updateParam(paramName, value) {
            let v = parseFloat(value);
            params[paramName] = v;
            document.getElementById(paramName + '-value').textContent = v;
            if (paramName === 'grain') {
                initializeSystem();
            }
        }

        function updateColor(colorId, value) {
            document.getElementById(colorId + '-value').textContent = value;
            if (colorId === 'color1') params.colorPalette[0] = value;
            if (colorId === 'color2') params.colorPalette[1] = value;
            if (colorId === 'color3') params.colorPalette[2] = value;
        }

        function downloadPNG() {
            saveCanvas('threshold-choir-' + params.seed, 'png');
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = { ...defaultParams, colorPalette: [...defaultParams.colorPalette] };

            document.getElementById('noiseIntensity').value = params.noiseIntensity;
            document.getElementById('noiseIntensity-value').textContent = params.noiseIntensity;
            document.getElementById('signalStrength').value = params.signalStrength;
            document.getElementById('signalStrength-value').textContent = params.signalStrength;
            document.getElementById('grain').value = params.grain;
            document.getElementById('grain-value').textContent = params.grain;
            document.getElementById('persistence').value = params.persistence;
            document.getElementById('persistence-value').textContent = params.persistence;

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
